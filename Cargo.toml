[package]
name = "hollow"
version = "0.1.0"
edition = "2024"

[features]
default = []
dev = ["bevy/bevy_dev_tools", "bevy/render_dev_tools", "avian3d/bevy_diagnostic"]

[dependencies]
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "parallel"] }
bevy = { version = "0.20", default-features = false, features = ["ui", "3d", "bevy_feathers", "bevy_settings"] }
pumpkin-worldgen = { path = "../worldgen" }
ron = "0.10"
serde = { version = "1.0", features = ["derive"] }

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
