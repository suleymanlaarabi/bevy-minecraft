[package]
name = "hollow"
version = "0.1.0"
edition = "2024"

[features]
default = []
dev = ["bevy/bevy_dev_tools", "bevy/render_dev_tools", "avian3d/bevy_diagnostic"]

[dependencies]
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "parallel"] }
bevy = { version = "0.20", default-features = false, features = ["ui", "3d", "bevy_feathers", "bevy_settings"] }
pumpkin-worldgen = { path = "../worldgen" }
pumpkin-data = { path = "../worldgen/crates/pumpkin-data" }
pumpkin-util = { path = "../worldgen/crates/pumpkin-util" }
serde_json = "1.0"
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
lz4_flex = "0.13"
directories = "6"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
bytemuck = "1"

[profile.dev]
opt-level = 2
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
# Without these, wgpu enables Vulkan validation and Bevy validates every indirect draw.
# Re-enable GPU validation when debugging shaders: `env WGPU_VALIDATION=1 cargo run`.
debug-assertions = false
overflow-checks = false
