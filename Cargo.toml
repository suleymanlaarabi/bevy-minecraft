[workspace]
members = [".", "crates/core", "crates/minecraft", "crates/engine", "crates/render", "crates/features", "crates/worldgen", "crates/worldgen/crates/*"]
resolver = "3"

[package]
name = "hollow"
version = "0.1.0"
edition = "2024"

[features]
default = []
dev = ["hollow-minecraft/dev"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["std"] }
hollow-minecraft = { path = "crates/minecraft" }

[profile.dev]
opt-level = 2
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
# Without these, wgpu enables Vulkan validation and Bevy validates every indirect draw.
# Re-enable GPU validation when debugging shaders: `env WGPU_VALIDATION=1 cargo run`.
debug-assertions = false
overflow-checks = false

# Workspace members do not inherit the dependency wildcard override. Preserve the
# generator packages' existing optimized development settings after integration.

[profile.dev.package.hollow-worldgen]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.pumpkin-data]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.pumpkin-util]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.pumpkin-nbt]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Shared section storage retains the generation provider's development optimization.
[profile.dev.package.hollow-core]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Keep the section mesher optimized like generation and shared section storage.
[profile.dev.package.hollow-render]
opt-level = 3
debug-assertions = false
overflow-checks = false
