[workspace]
members = [".", "crates/worldgen", "crates/worldgen/crates/*"]
resolver = "3"

[package]
name = "hollow"
version = "0.1.0"
edition = "2024"

[features]
default = []
dev = ["bevy/bevy_dev_tools", "bevy/render_dev_tools", "bevy/sysinfo_plugin"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_winit",
    "keyboard",
    "mouse",
    "wayland",
    # Feathers enables custom cursors; Winit must support the same cursor variants.
    "custom_cursor",
    "bevy_pbr",
    "bevy_gizmos_render",
    "bevy_anti_alias",
    "bevy_post_process",
    "tonemapping_luts",
    "zstd_rust",
    "png",
    "bevy_ui_render",
    "bevy_feathers",
    "bevy_scene",
    "bevy_settings",
    "default_font",
    "ui_picking",
] }
hollow-worldgen = { path = "crates/worldgen" }
pumpkin-data = { path = "crates/worldgen/crates/pumpkin-data" }
pumpkin-util = { path = "crates/worldgen/crates/pumpkin-util" }
serde_json = "1.0"
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }
bytemuck = "1"

[profile.dev]
opt-level = 2
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
# Without these, wgpu enables Vulkan validation and Bevy validates every indirect draw.
# Re-enable GPU validation when debugging shaders: `env WGPU_VALIDATION=1 cargo run`.
debug-assertions = false
overflow-checks = false

# Workspace members do not inherit the dependency wildcard override. Preserve the
# generator packages' existing optimized development settings after integration.

[profile.dev.package.hollow-worldgen]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.pumpkin-data]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.pumpkin-util]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.pumpkin-nbt]
opt-level = 3
debug-assertions = false
overflow-checks = false
