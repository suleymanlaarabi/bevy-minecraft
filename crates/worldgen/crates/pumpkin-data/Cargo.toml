# Copied from Pumpkin 8ca5cb443272e0ac4f59b4c2ac059bdc72c2a22b (GPL-3.0), modified locally.
# Workspace inheritance is flattened; Pumpkin crates depend on each other by path.
[package]
name = "pumpkin-data"
version = "0.2.1+26.3-26.51"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0"
build = "build.rs"

[features]
default = [
    "item",
    "jukebox_song",
    "registry",
    "screen",
    "particle",
    "statistic",
    "sound",
    "recipes",
    "data_component",
    "attributes",
    "chunk",
    "game_event",
    "game_rules",
    "entity",
    "dimension",
    "environment_attribute",
    "enchantment",
    "world",
    "scoreboard",
    "damage",
    "fluid",
    "block",
    "tag",
    "noise_router",
    "composter",
    "flower_pot",
    "effect",
    "structures",
    "potion",
    "material_rule",
    "noise_settings",
    "carver",
    "villager",
    "placed_feature",
    "configured_feature",
    "slot_ranges",
    "bedrock_creative",
    "bedrock_biome",
    "map_color",
    "map_decoration",
    "dye_color",
    "entity_variant",
    "block_transformer",
    "trial_spawner",
    "test_instance",
    "painting_variant",
    "context_provider",
    "instrument",
    "wolf_variant",
    "cat_variant",
    "frog_variant",
    "trim_material",
    "trim_pattern",
    "banner_pattern",
    "decorated_pot_pattern",
    "chat_type",
    "enchantment_provider",
    "cow_variant",
    "cow_sound_variant",
    "pig_variant",
    "pig_sound_variant",
    "chicken_variant",
    "chicken_sound_variant",
    "cat_sound_variant",
    "wolf_sound_variant",
    "zombie_nautilus_variant",
]

cow_variant = ["tag"]
cow_sound_variant = ["sound"]
pig_variant = ["tag"]
pig_sound_variant = ["sound"]
chicken_variant = ["tag"]
chicken_sound_variant = ["sound"]
cat_sound_variant = ["sound"]
wolf_sound_variant = ["sound"]
zombie_nautilus_variant = ["tag"]
enchantment_provider = ["enchantment", "item", "tag"]
instrument = ["sound"]
wolf_variant = []
cat_variant = []
frog_variant = []
trim_material = []
trim_pattern = []
banner_pattern = []
decorated_pot_pattern = []
chat_type = []
context_provider = []
painting_variant = []
test_instance = []
trial_spawner = []
block_transformer = ["block", "sound", "world", "tag"]
map_color = []
map_decoration = []
dye_color = []
entity_variant = ["dye_color"]
bedrock_creative = []
bedrock_biome = []
item = []
jukebox_song = []
registry = []
screen = []
particle = []
statistic = []
sound = []
recipes = []
data_component = []
attributes = []
chunk = ["noise_parameter", "biome", "chunk_status"]
game_event = []
game_rules = []
entity = ["entity_pose", "entity_status", "entity_type", "spawn_egg"]
dimension = []
environment_attribute = []
enchantment = []
world = ["world_event", "message_type"]
scoreboard = []
damage = []
fluid = []
tag = []
noise_router = []
composter = []
flower_pot = []
effect = []
structures = []
potion = ["potion_brewing"]
material_rule = []
noise_settings = []
chunk_gen_settings = ["noise_settings", "material_rule"]
carver = []
villager = ["item", "sound"]
slot_ranges = []

noise_parameter = []
biome = ["carver"]
chunk_status = []
entity_pose = []
entity_status = []
entity_type = ["sound"]
spawn_egg = []
world_event = []
message_type = []
placed_feature = []
configured_feature = []
block = []
potion_brewing = []

[dependencies]
phf = { version = "0.14.0", default-features = false, features = ["std", "macros"] }
pumpkin-util = { path = "../pumpkin-util" }
pumpkin-nbt = { path = "../pumpkin-nbt" }
serde = { version = "1.0", default-features = false, features = ["derive", "std", "rc"] }
crc32c = { version = "0.6.8", default-features = false }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "thread_rng"] }

[package.metadata.cargo-machete]
ignored = ["phf"]
