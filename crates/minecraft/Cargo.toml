[package]
name = "hollow-minecraft"
version = "0.1.0"
edition = "2024"

[features]
default = []
dev = ["bevy/bevy_dev_tools", "bevy/render_dev_tools", "bevy/sysinfo_plugin"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_winit",
    "keyboard",
    "mouse",
    "wayland",
    # Feathers enables custom cursors; Winit must support the same cursor variants.
    "custom_cursor",
    "bevy_pbr",
    "bevy_gizmos_render",
    "bevy_anti_alias",
    "bevy_post_process",
    "tonemapping_luts",
    "zstd_rust",
    "png",
    "bevy_ui_render",
    "bevy_audio",
    "vorbis",
    "bevy_feathers",
    "bevy_scene",
    "bevy_settings",
    "default_font",
    "ui_picking",
] }
hollow-features = { path = "../features" }
hollow-engine = { path = "../engine" }
hollow-core = { path = "../core" }
hollow-worldgen = { path = "../worldgen" }
pumpkin-data = { path = "../worldgen/crates/pumpkin-data" }
pumpkin-util = { path = "../worldgen/crates/pumpkin-util" }
serde_json = "1.0"
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }
bytemuck = "1"

